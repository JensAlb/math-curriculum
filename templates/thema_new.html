<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Neues Thema anlegen</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >
</head>
<body class="p-4">

<h1 class="mb-4">➕ Neues Thema anlegen</h1>

<form action="/thema/create" method="POST">

    <!-- Titel -->
    <div class="mb-3">
        <label class="form-label">Titel</label>
        <input name="titel" type="text" class="form-control" required>
    </div>

    <!-- Beschreibung -->
    <div class="mb-3">
        <label class="form-label">Beschreibung</label>
        <textarea name="beschreibung" class="form-control" rows="4"></textarea>
    </div>

    <!-- Fachbereich -->
    <div class="mb-3">
        <label class="form-label">Fachbereich</label>
        <input name="fachbereich" type="text" class="form-control">
    </div>

    <!-- Methode -->
    <div class="mb-3">
        <label class="form-label">Methode</label>
        <input name="methode" type="text" class="form-control">
    </div>

    <!-- Digitale Hilfsmittel -->
    <div class="mb-3">
        <label class="form-label">Digitale Hilfsmittel</label>
        <input name="digitale_hilfsmittel" type="text" class="form-control">
    </div>

    <!-- Schwierigkeit -->
    <div class="mb-3">
        <label class="form-label">Schwierigkeit (1–5)</label>
        <input name="schwierigkeit" type="number" min="1" max="5" class="form-control" value="1">
    </div>

    <!-- Jahrgänge -->
    <div class="mb-4">
        <label class="form-label">Jahrgänge</label>
        <div class="row">
            {% for j in jahrgaenge %}
            <div class="col-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="jahrgang_ids"
                           value="{{ j.id }}" id="j{{ j.id }}">
                    <label class="form-check-label" for="j{{ j.id }}">
                        {{ j.name }}
                    </label>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <!-- Buttons -->
    <button type="submit" class="btn btn-primary">Speichern</button>
    <a href="/" class="btn btn-secondary">Abbrechen</a>

</form>

</body>
</html>
